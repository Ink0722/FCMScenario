task: 你的任务是在上述四年安排下，选择总融资成本较低的报价。
knowledge:
- id: term-01
  title: 利率折扣点
  text: 一个折扣点等于贷款本金的1%。贷款机构可以用签约时收取折扣费的方式提供另一档利率；具体费率与点数的关系以报价为准。
- id: term-02
  title: 月供与未偿本金
  text: 月供是每期支付的金额；未偿本金是付款后尚未归还的借款余额。合同期限决定月供的摊还方式，实际结清时间决定会支付多少期月供及何时偿还余额。
- id: term-03
  title: 固定利率
  text: 固定利率贷款在合同约定期间采用同一利率，月供中的本金与利息比例仍会随着未偿本金变化。

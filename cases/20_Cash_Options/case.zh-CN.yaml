schema_version: '2.0'
case_id: '20'
scenario_id: S-RSV-CASH-01
locale: zh-CN
title: 现金账户：银行存款还是政府货币基金
template: table
background: 你准备开立现金管理账户，正在选择银行存款归集或政府货币市场基金作为起始核心头寸。
common_facts:
- 你准备将20,000美元放进一个现金管理账户，用于未来12个月的日常支出和一般备用。你会分次使用这笔资金，具体付款日期和金额随实际安排变化；本次不用于股票交易、融资或需要锁定到期日的投资。
- 平台提供两个可以选作账户“核心头寸”的安排。核心头寸接收转入的现金，账户付款时也从它取款。你已经完成开户资格核验，两项都可选，只需要决定开始使用哪一种。
- 两项使用同一个现金管理账户，均可配合账户的借记卡、支票、账单支付和银行转账；账户没有开户最低余额或本次账户管理费。已有银行和平台余额已经核对，不存在超出A存款保险额度或溢出到其他安排的情形。
options:
- id: A
  label: 采用银行存款归集核心头寸
- id: B
  label: 采用政府货币市场基金核心头寸
comparison:
- id: attribute-01
  attribute: 转入资金的去向
  values:
    A: 平台按存款归集规则转入参与银行，形成银行存款
    B: 自动买入政府货币市场基金份额
- id: attribute-02
  attribute: 开始比较使用的收益指标
  values:
    A: 存款年化收益率APY为1.84%
    B: 基金七日年化收益率为3.28%
- id: attribute-03
  attribute: 指标的含义
  values:
    A: 按所列存款利率及复利规则计算的年化收益率，存款利率可调整
    B: 根据最近7日净收益折算的年化指标，已反映基金运营费，随实际基金收益变化
- id: attribute-04
  attribute: 基金内部运营费
  values:
    A: 不购买该基金，无该项基金费
    B: 总年度运营费率0.42%，从基金资产承担，不另外按账户余额开账单
- id: attribute-05
  attribute: 资金保障机制
  values:
    A: 符合记录及存款归集条件时，按参与银行的FDIC存款保险规则保障
    B: 基金份额不是银行存款，不属于FDIC存款保险
- id: attribute-06
  attribute: 资金运作
  values:
    A: 参与银行依存款规则持有及计息
    B: 主要投资现金、美国政府证券及符合规则的回购协议
- id: attribute-07
  attribute: 价值及账户付款
  values:
    A: 从银行存款中提取相应金额处理账户付款
    B: 基金以每份1美元的稳定价格为目标，账户付款时自动赎回相应份额；该价格目标不是本金保证
additional_information:
- id: information-01
  kind: terms
  title: 起始收益指标
  text: 这里的两个收益指标是本次场景开始时采用的起始资料，不是固定12个月的合同利率。B列示的七日年化指标与A的APY采用不同计算口径；之后的利率、基金实际收益和余额随各自机制及你的支出变化。
- id: information-02
  kind: history
  title: 现金产品历史记录
  text: |-
    你查阅的现金产品资料附有以下两项历史记录。它们涉及的机构和产品均不是本次账户的参与银行或政府货币基金：

    ##### 资产及事件

    **2008年9月：** 货币基金R持有企业发行的债务证券，其中包括雷曼证券；基金每份净值降至0.97美元

    **2023年3月：** 银行V倒闭，存款账户由接管及处置安排处理

    ##### 当时的处理记录

    **2008年9月：** 基金宣布暂停支付赎回款，随后进入相关处置安排

    **2023年3月：** 主管部门采用系统性风险例外保护该行全部存款，存款人自3月13日起可以使用资金；该事件包括超过常规保险限额的存款
- id: information-03
  kind: terms
  title: 适用及办理条款
  text: |-
    A的FDIC保险按每个参与银行、每位存款人和账户所有权类别计算，通常每类最高250,000美元。该银行其他同类别存款需合并计算；本次已核对合并余额在额度内，平台保留满足归集保障条件的记录。保险对应参与银行倒闭时的合格存款，不是给基金投资提供的保障。

    B采用政府货币市场基金规则，至少99.5%的总资产配置于现金、政府证券或以现金／政府证券充分抵押的回购协议。基金收入随短期资产收益变化，分配的收益留在账户并按核心头寸机制继续运作。提款所用份额按照实际适用的赎回价值结算。

    两项日常支付工具相同，本次没有因选择某项而增加专属客服或理财服务。你选择的是现金的持有和收益机制；以后可以按平台规则更换核心头寸，但本次不把将来换项安排预定为结果。

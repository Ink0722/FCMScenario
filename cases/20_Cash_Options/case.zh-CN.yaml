task: 请选择开始使用的核心头寸：银行存款归集或政府货币市场基金。
knowledge:
- id: term-01
  title: 核心头寸
  text: 账户接收现金及支付取款的默认持有安排。
- id: term-02
  title: APY
  text: 考虑复利规则的存款年化收益率。
- id: term-03
  title: 七日年化收益率
  text: 根据基金近期七日收益折算的指标，用于描述近期收益水平。
- id: term-04
  title: 政府货币市场基金
  text: 投资符合政府货币基金规则的短期资产的基金。持有人拥有基金份额，与银行存款合同不同。
- id: term-05
  title: 存款归集
  text: 平台把客户现金按规则存放于参与银行；保险资格取决于存款性质、归集记录及相应额度。

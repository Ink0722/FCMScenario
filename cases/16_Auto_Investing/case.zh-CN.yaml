task: 请选择平台自动管理或自行管理。
knowledge:
- id: term-01
  title: ETF
  text: 在交易所买卖的基金，通过基金持有一组资产。基金内部运营费与账户另外收取的顾问费是两种费用。
- id: term-02
  title: 再平衡
  text: 持仓比例变化后，通过买卖使组合回到管理规则中的目标配置。
- id: term-03
  title: 应税账户
  text: 不是退休账户；交易实现的收益和损失按适用税务规则处理。
- id: term-04
  title: 税损收割
  text: 出售亏损持仓并按规则安排替代持仓的税务管理措施。

schema_version: '2.0'
case_id: '12'
scenario_id: S-PAY-MP-01
locale: zh-CN
title: 房贷还款渠道：双周扣款与本金入账
template: table
background: 你准备为正在正常还款的固定利率房贷设置双周扣款，正在选择第三方还款服务或贷款机构直接扣款。
common_facts:
- 你有一笔正在正常还款的固定利率房贷，当前本金余额为120,000美元，每月本金与利息的正常付款为1,000美元。房产税和房屋保险另行支付，不包含在这笔月供内。账户没有逾期，也没有未结清费用。
- 你准备从下一个还款年度开始，使用每两周扣款的方式安排还贷。本次完整年度共26次双周扣款，第六个月和第十二个月各有三次扣款，其余月份各有两次。正常月供仍按每月到期日入账。
- 你比较通过第三方还款服务办理，或直接使用贷款机构的自动扣款功能。两种渠道都已确认适用于你的贷款，并可以按计划开始。全年用于这项安排的资金预算为13,065美元；这笔预算不另作投资或消费。
- '**双周正常扣款部分：** 每次500美元。'
- '**每年双周扣款次数：** 26次。'
- '**正常月供入账：** 按原合同每月到期日向贷款机构支付1,000美元。'
- 本次比较从付款设置完成后的正常月份开始，覆盖接下来的连续十二个月。参考文件中首次设置的过渡付款发生在本窗口开始之前；该过渡步骤不改变这里已确认的120,000美元起始本金、26次扣款日历及13,065美元全年预算。
- 本次扣款日历采用已确认的26次安排。
options:
- id: A
  label: 通过第三方服务办理双周扣款
- id: B
  label: 通过贷款机构直接扣款，并完成年末补充本金付款
comparison:
- id: attribute-01
  attribute: 双周交易费
  values:
    A: 每次2.50美元，另外扣取
    B: 无该交易费
- id: attribute-02
  attribute: 加入费
  values:
    A: 295美元，从额外扣款中收取
    B: 无加入费
- id: attribute-03
  attribute: 扣款后的资金位置
  values:
    A: 第三方保管账户
    B: 贷款机构的未分配付款记录
- id: attribute-04
  attribute: 三次扣款月份的额外500美元
  values:
    A: 先清偿尚未收完的加入费，剩余金额在当月正常月供入账后冲减本金
    B: 在同一时点将额外500美元冲减本金
- id: attribute-05
  attribute: 交易费与本金
  values:
    A: 交易费支付给服务商，不计入还贷本金
    B: 本次预算中保留的对应资金留在原银行账户
- id: attribute-06
  attribute: 年末的补充操作
  values:
    A: 本年度预算已按扣款安排使用
    B: 第十二个月正常付款及额外付款入账后，将保留的对应资金另作一次本金付款
- id: attribute-07
  attribute: 额外本金付款收费
  values:
    A: 无提前还款罚金
    B: 同样无提前还款罚金；本次年末在线本金付款免费
- id: attribute-08
  attribute: 服务管理
  values:
    A: 向第三方登记扣款账户并查看服务扣款记录
    B: 在贷款机构账户设置扣款，并核对贷款入账记录
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **加入费的收取。** A不在开通时另外扣295美元。第六个月出现额外的500美元时，服务商先从中扣除全部加入费，再把余款作为额外本金付款。第十二个月的额外500美元按上述安排处理。

    **扣款与入账。** 两种方案均不把每次500美元直接视作一笔完整月供。凑足正常月供后，按合同到期日办理。本次两种方案的正常付款日、额外本金入账日及到账条件均已确认，不发生迟付。

    **全年资金安排。** A每次实际从银行账户扣取500美元与2.50美元交易费。B每次自动扣500美元，其余对应预算继续留在银行账户，在年末按上述安排支付给贷款机构。两种方案均使用全年13,065美元，不在预算外补缴服务费用。

    **贷款计息。** 房贷采用相同的正固定利率，月利息按上个月未偿本金计算；正常月供金额不因本次额外还款而重新降低。额外本金冲减会改变后续计息本金，贷款不会在本年度内结清。

    **本次办理范围。** 两种方案的自动扣款均能正常执行；不设置忘记付款、扣款失败或新增银行手续费。服务可按流程变更，但本次选择覆盖完整年度，期间不取消、不改扣款频率。

task: 你的任务是在按时完成正常付款的前提下，选择费用较少、能把更多预算用于减少贷款本金的安排。
knowledge:
- id: term-01
  title: 双周与每月两次
  text: 双周是每十四天一次，完整年度通常有26次；每月两次则是每年24次。
- id: term-02
  title: 未分配付款
  text: 收到的资金尚不足一笔完整付款，或尚未到约定入账时点时，可以先记录为未分配资金。扣款日期与贷款账户实际应用资金的日期是不同记录。
- id: term-03
  title: 额外本金付款
  text: 在正常付款之外，明确指定冲减贷款本金的付款，属于额外本金付款。正常月供仍按合同执行。

task: 你需要选择使这一年账户层费用报价更低的方案。
knowledge:
- id: term-01
  title: 顾问账户与经纪账户
  text: 顾问账户按协议提供持续投资建议与账户服务。经纪账户主要办理客户指示的交易，也可以提供与交易有关的建议；持续账户跟踪的范围取决于协议。
- id: term-02
  title: 资产收费与交易收费
  text: 按资产收费以账户资产价值为基数。佣金以每笔成交本金为基数，买入和卖出分别收费。平台费支付账户平台相关服务；交易处理费按符合收费条件的订单收取。
- id: term-03
  title: ETF与配置调整
  text: ETF是可在交易市场买卖的基金份额。配置调整通过买入和卖出改变各项投资的比例；一次调整可能涉及多个产品和多笔订单。

schema_version: '2.0'
case_id: '05'
scenario_id: S-WR-01
locale: zh-CN
title: 账户收费方式：一年交易安排
template: table
background: 你在机构M的顾问账户中持有资产，已确认下一年的配置与交易安排，正在选择继续使用顾问账户或改用同一机构的经纪账户。
common_facts:
- 你在机构M的顾问账户中持有100,000美元资产，已经确认下一年的投资配置与交易安排。
- 账户转换不要求出售现有投资。
- 本次比较的是完成下列一年交易安排所需的账户服务与交易执行费用。机构为两种方案采用同一费用试算条件：各月的账户平均计费价值均为100,000美元，表内单笔交易金额按所列数值执行；不追加资金、不提款，不作表外交易。这里的100,000美元是共同费用试算基数。
- 两边均已确认可以完成该安排。
- '**其他开户、转换、托管及账户服务费：** 本次不另收。'
- 两边持有相同ETF及份额，底层投资和基金内部收费条件相同。ETF甲、乙、丙均为非关联基金。两边交易资格、执行渠道、成交条件、税务及账户权益在本次安排中不设差异。
- 本次交易安排如下。一次调整可以包含多笔买卖；各笔按单独订单办理，当日完成，不合并成一笔交易。
- |-
  | 办理时间 | 买卖方向 | 产品 | 单笔交易金额 |
  |---|---|---|---:|
  | 第一个月的配置调整 | 卖出 | ETF甲 | 25,000美元 |
  | 同一次调整 | 买入 | ETF乙 | 12,500美元 |
  | 同一次调整 | 买入 | ETF丙 | 12,500美元 |
  | 第七个月的配置调整 | 卖出 | ETF乙 | 5,000美元 |
  | 同一次调整 | 买入 | ETF丙 | 5,000美元 |
- 以上金额为证券成交本金，费用另行计入报价，不包含在成交金额里。卖出所得用于同次调整的买入。
options:
- id: A
  label: 继续使用顾问账户
- id: B
  label: 改用经纪账户
comparison:
- id: attribute-01
  attribute: 方案识别代码
  values:
    A: AC01
    B: AC02
- id: attribute-02
  attribute: 原持仓处理
  values:
    A: 继续持有
    B: 原持仓直接转入
- id: attribute-03
  attribute: 年度服务费
  values:
    A: 按账户价值收取1.35%
    B: 无此项按资产收费
- id: attribute-04
  attribute: 年度平台费
  values:
    A: 按账户价值收取0.05%
    B: 无此项按资产收费
- id: attribute-05
  attribute: 本次交易的佣金与执行费用
  values:
    A: 已包含在上述账户费用中
    B: 每笔按下方佣金规则收费
- id: attribute-06
  attribute: 交易相关咨询
  values:
    A: 随持续顾问服务提供
    B: 随交易提供相关建议
- id: attribute-07
  attribute: 配置跟踪
  values:
    A: 持续检查与定期咨询
    B: 根据本人提交的交易指令办理
- id: attribute-08
  attribute: 交易决定
  values:
    A: 本人确认；已授权的年度调整按规则执行
    B: 本人提交每笔交易指令
- id: attribute-09
  attribute: 信息展示
  values:
    A: 对账单、账户绩效及配置检查资料
    B: 对账单与逐笔成交确认
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **A的收费。** 1.35%的服务费与0.05%的平台费分别收取，均按包含现金在内的账户资产价值计算，按月后付。本次采用100,000美元的共同月平均计费基数，持有完整十二个月；没有合并计费、协商优惠、前期佣金减免或额外费用返还。

    **B的收费。** 买入与卖出均按每笔成交本金适用下表。费表中的金额项每笔收一次；这里按所在行的整笔本金计算，不将同一订单拆成多个区段。

    | 单笔成交本金 | 该笔佣金 |
    |---|---:|
    | 不超过5,999.99美元 | 本金的2.50% |
    | 6,000—9,999.99美元 | 本金的2.00%＋30美元 |
    | 10,000—24,999.99美元 | 本金的1.50%＋80美元 |
    | 25,000—99,999.99美元 | 本金的1.00%＋205美元 |

    除第一档外，每笔交易另加4.95美元交易处理费。上述五笔交易没有其他最低佣金、跨日执行或特殊证券收费。

    **共同服务条件。** 本次配置与交易方案已经确定，两边均使用该方案，不增加税务、法律、遗产规划或其他家庭资产的管理服务。ETF内部费用不包含在A的账户费或B的佣金中，两个账户持有相同份额。本次报价不另计差异性税费或成交成本。

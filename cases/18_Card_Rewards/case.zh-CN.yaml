task: 请选择未来一年的主要消费卡。你需要考虑常规消费的奖励、兑换方式、旅行使用和额外管理步骤。
knowledge:
- id: term-01
  title: 返现
  text: 按合格消费金额获得以美元表示的奖励，可按渠道规则兑换为账户抵扣等。
- id: term-02
  title: 积分倍率
  text: 获得多少积分的规则，与每积分在某项兑换中的价值是两件事。
- id: term-03
  title: 商户类别
  text: 付款网络对商户业务的分类，发卡行据此适用某些奖励倍率。
- id: term-04
  title: 伙伴转移
  text: 把银行积分换成航空或酒店计划的积分单位，后续按接收计划的规则使用。

schema_version: '2.0'
case_id: '18'
scenario_id: S-AMX-RWD-01
locale: zh-CN
title: 信用卡奖励：统一返现还是分类积分
template: table
background: 你准备把一个信用卡账户作为未来12个月的主要消费卡，正在选择统一返现或分类积分安排。
common_facts:
- 你准备把一个信用卡账户改为未来12个月的主要消费卡。银行已确认你可以在两个方案中选择其一，信用额度相同，账户转换不收手续费，也不提供开户奖励。你没有其他可以接收该银行积分的信用卡，既有奖励已结算。
- 常规消费计划为每月1,000美元：200美元餐饮、100美元加油、400美元普通超市购物、300美元其他日常购物。餐饮和加油的商户类别已确认符合B的三倍积分规则；超市和其他日常购物按B的普通消费规则处理。金额均为扣除退款后的合格消费。
- 你还计划未来一年安排一次旅行，可能涉及酒店、交通及境外消费。旅行的实际日期、路线和付款额取决于之后安排。你会每月按时全额支付账单，因此本次比较不包含循环借款利息。
- 两项均为可以支付日常商品、服务和旅行的通用消费信用卡。
- '**年费：** 0美元。'
- '**奖励有效期：** 账户保持开放时奖励不因时间经过到期。'
- 两项都提供线上账单、消费记录和手机账户管理。消费退货或退款会相应减少奖励。奖励不以买入额外金融产品为条件；本次只选择一个主要消费卡，不同时开通两项或跨卡合并奖励。
options:
- id: A
  label: 采用统一返现卡
- id: B
  label: 采用分类积分及伙伴转移卡
comparison:
- id: attribute-01
  attribute: 账户资料名称
  values:
    A: 日常返现
    B: 旅行与分类积分
- id: attribute-02
  attribute: 一般合格消费奖励
  values:
    A: 每消费1美元获得0.02美元返现
    B: 每消费1美元获得1积分
- id: attribute-03
  attribute: 餐饮、加油消费奖励
  values:
    A: 同样2%返现
    B: 每消费1美元合计获得3积分
- id: attribute-04
  attribute: 其他三倍积分类别
  values:
    A: 无额外类别倍率
    B: 符合商户类别规则的旅行、公共交通、娱乐（包括指定流媒体、书籍、音乐等）及电话服务
- id: attribute-05
  attribute: 兑现为账户抵扣
  values:
    A: 以返现金额抵扣合格账户
    B: 100积分对应1美元的现金兑换价值；按兑换渠道规定的批量操作
- id: attribute-06
  attribute: 旅行兑换
  values:
    A: 可以使用奖励支付平台上的旅行，也可以兑现后自行支付
    B: 可以使用积分支付平台旅行，也可以兑换现金，或转入指定航空／酒店伙伴计划
- id: attribute-07
  attribute: 伙伴积分转移
  values:
    A: 此卡自身不提供伙伴积分转移
    B: 只通过线上渠道办理；标准为1积分换1伙伴单位，特定伙伴可以另有比例
- id: attribute-08
  attribute: 境外交易费
  values:
    A: 换算美元金额的3%
    B: 0%
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    B的三倍规则依商户类别识别；一般超市、日常购物并不因销售食品或燃油相关商品就自动成为三倍类别。上述固定常规消费已按实际类别确认，未来旅行交易依其实际商户分类处理。

    B的伙伴名单包含酒店伙伴H，当前列示兑换比例为1个银行积分换2个酒店积分。兑换房晚时，按H的会员规则查询具体酒店、入住日期、房型、所需积分及适用费用；银行积分、酒店积分和房晚分别按各自规则记录。

    B可以不转移积分而使用现金兑换。若选择伙伴转移，需要使用符合条件的伙伴会员账户，之后依伙伴计划的积分价格、可订资源及税费安排兑换。伙伴规则和可用房间、座位决定具体兑换结果，转入的伙伴积分不等于现金存款。

    A兑现后的现金可以用于任何正常支出，包括旅行；B的伙伴转移是另外一条兑换渠道。你本次不预订具体奖励机票或房间，选择的是未来一年使用的奖励机制。

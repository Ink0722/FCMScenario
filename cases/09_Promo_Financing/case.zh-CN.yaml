schema_version: '2.0'
case_id: 09
scenario_id: S-CC-PROMO-01
locale: zh-CN
title: 消费融资选择：较长优惠期与不同计息规则
template: table
background: 你已经确定听力设备及配套服务的购买安排，正在选择商户合作融资卡或通用购买优惠卡。
common_facts:
- 你已经确定一笔听力设备及配套服务的购买安排，总价为6,000美元。商户支持两种信用卡付款方式，商品、服务、购买价格及退款规则相同；本次只选择融资方式，不重新选择商品。
- 本次两种申请渠道均可用，模拟资格核验允许额度覆盖整笔购买。你会把本次购买全部记在一种卡上，不拆分支付。
- 两边都需要每月还款，也允许在最低还款之外多还。
- '**本次购买金额：** 6,000美元。'
- '**月度还款：** 按账单要求支付最低金额，可多还或提前还清。'
- '**年费：** 无。'
- '**账单与付款：** 可使用电子账单、网上付款。'
options:
- id: A
  label: 采用24个月内全部还清则不收利息的商户合作融资卡
- id: B
  label: 采用开户后15个月购买零利率的通用卡
comparison:
- id: attribute-01
  attribute: 优惠起算点
  values:
    A: 本次购买记账日
    B: 新卡开户日
- id: attribute-02
  attribute: 优惠期限
  values:
    A: 24个月
    B: 15个月
- id: attribute-03
  attribute: 优惠期间的计息
  values:
    A: 按32.99%购买APR计算利息，暂不收取；期内全部还清该促销余额则免除
    B: 本次购买适用0% APR，优惠期间不产生购买利息
- id: attribute-04
  attribute: 优惠结束时仍有促销余额
  values:
    A: 收取自购买日起按合同余额计算的累计利息，未还余额继续按普通规则计息
    B: 未还余额从优惠结束后适用普通购买APR，不追收零利率期间的购买利息
- id: attribute-05
  attribute: 普通购买APR
  values:
    A: 32.99%
    B: 公开条款区间18.49%—27.99%，具体档位在审批时确定，并随基准利率变化
- id: attribute-06
  attribute: 本次消费奖励
  values:
    A: 当前方案不设消费奖励
    B: 普通购买返现1.5%；符合新客条件，开户三个月内购买满500美元可获得200美元奖励
- id: attribute-07
  attribute: 后续使用范围
  values:
    A: 合作医疗及健康服务网络和指定零售商
    B: 接受该通用信用卡的商户
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **购买与开户。** A的24个月活动由本次商户提供，适用于这笔超过200美元的合资格购买。B选择所列15个月购买优惠；本次在开户当天完成购买，不把开户后已经经过的月份重新计入优惠期。两边的新卡都没有旧余额；本次使用后不添加其他购买、不取现、不转移其他信用卡余额。

    **账单最低还款。** 最低还款金额由合同和账单余额决定，不是把6,000美元自动平均分成24份或15份。A在没有逾期、利息收费及其他余额时，最低额以30美元或账单余额的3.25%两者较大者为基础，按合同向上取整且不超过余额。两边都可以自行设置额外还款。

    **优惠结束处理。** A免除累计利息的条件是促销余额在活动截止日前全部结清，逐月支付账单最低额本身不等于满足该条件。B零利率结束后，只按之后的普通条款处理仍未清偿的余额。

    **本次付款条件。** 两边都使用免费电子账单及普通网上付款，按时支付至少账单最低额，且付款不会被退回。A收费期内的最低利息收费为2美元；该金额不替代按合同计算的实际利息。B不设最低利息收费。本次不发生逾期或退票收费。

    **奖励办理。** 本次模拟满足B的新客奖励资格，购买按普通消费类别处理；奖励在满足条件后按机构规则入账，可申请兑换为现金或账单抵扣。若抵扣与付款合计尚未结清本期账单，仍需按机构规则支付最低额或较低的剩余账单余额；本次退款时按规则调整相应奖励。

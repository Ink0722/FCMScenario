schema_version: '2.0'
case_id: '17'
scenario_id: S-GLO-ARM-01
locale: zh-CN
title: 住房贷款：固定月供还是先固定后浮动
template: table
background: 你准备购买住房，贷款机构提供固定利率和先固定后浮动利率两种贷款合同。
common_facts:
- 你准备购买一套住房，已安排好首付款。需要借款216,000美元，贷款按30年分期摊还，每月归还一部分本金并支付利息。贷款机构提供两个已确认可以办理的方案，贷款本金、放款日期和还款起始日期相同。
- 本次考虑你计划持有住房和这笔贷款的前12年。在此期间按合同逐月还款，不提前还款或再融资；到第12年末，对尚未清偿的本金一并结算。两种合同的最高允许月供均在已经安排的住房支出预算内，因此都可以执行。
- '**借款本金、摊还期限：** 216,000美元，30年。'
- '**折扣点及贷款机构费用：** 本次不支付折扣点；双方其他贷款机构费用相同。'
- 这里的月供只包括本金和利息。房产税、住房保险及两项共同的交易费用由已安排的其他资金支付，不随选项改变。两项都没有本次持有安排涉及的提前结清罚金，也没有只付利息或增加本金余额的付款方式。
- 本次两个方案均不收利率折扣点费用。
options:
- id: A
  label: 采用固定利率贷款
- id: B
  label: 采用先固定后浮动的贷款
comparison:
- id: attribute-01
  attribute: 开始适用的年利率
  values:
    A: 5.00%
    B: 前60个月3.00%
- id: attribute-02
  attribute: 开始的本金及利息月供
  values:
    A: 约1,159.53美元
    B: 前60个月约910.66美元
- id: attribute-03
  attribute: 首次利率调整
  values:
    A: 不调整
    B: 第61个月
- id: attribute-04
  attribute: 之后调整频率
  values:
    A: 不调整
    B: 每12个月调整一次
- id: attribute-05
  attribute: 调整时采用的利率规则
  values:
    A: 始终5.00%
    B: 1年期美国国债指数利率加2.50个百分点，再按调整上限及利率上下限处理
- id: attribute-06
  attribute: 单次调整上限
  values:
    A: 不适用
    B: 首次及以后每次，相对之前利率最多上升或下降2个百分点
- id: attribute-07
  attribute: 整个贷款期间的利率范围
  values:
    A: 5.00%
    B: 最低2.50%，最高8.00%
- id: attribute-08
  attribute: 调整后的月供
  values:
    A: 本金及利息月供保持不变
    B: 按当时未偿本金、新利率和剩余摊还期限重新计算
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    B的前5年利率确定，之后的每次调整使用合同规定观察日的指数。指数未来数值随市场变化；调整上限限制一次变化的幅度，整个贷款的利率上下限也继续适用。合同期限仍是30年，并不是第5年必须清偿全部贷款。

    A在前12年的本金及利息月供按同一利率计算。B在前5年按3.00%计算，从第6年开始由调整规则决定之后的利率、月供和归还本金进度。第12年末两项都结算各自届时未清偿本金。

    你现在选择的是贷款合同；第6年至第12年的实际指数尚未发生。本次不包含以后出售住房、换贷款或改变付款计划的另外选择。

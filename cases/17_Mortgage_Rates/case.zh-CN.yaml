task: 请决定采用固定利率贷款，还是前5年固定、之后每年调整利率的贷款。你需要权衡借款支出、月供安排与利率调整，而不是另行判断购房预算或贷款资格。
knowledge:
- id: term-01
  title: 5/1浮动利率贷款
  text: 前5年采用初始固定利率，之后通常每年调整一次。
- id: term-02
  title: 指数与加点
  text: 指数是合同引用的市场利率，加点是合同规定增加的百分点；调整后的利率还受合同上限与下限约束。
- id: term-03
  title: 摊还
  text: 每期付款同时归还本金和利息。利率变化时，相同付款总额并不代表相同的剩余本金。
- id: term-04
  title: 折扣点
  text: 为取得某一利率而预先向贷款机构支付的费用。

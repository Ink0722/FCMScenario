schema_version: '2.0'
case_id: '02'
scenario_id: S-MET-01
locale: zh-CN
title: 年金合同替换：四年持有
template: cards
background: 你持有保险公司M的一份可变年金合同，现在收到同一保险公司的新合同替换方案。
common_facts:
- 你持有保险公司M的一份可变年金合同，当前账户价值为100,000美元。合同已持有整十二年，期间没有追加投入、取款或贷款。原合同附有身故保障，已经记录的最高合同周年账户价值为140,000美元。
- 原合同当前退出不收退保费，替换不需要额外投入资金。
- 本次资金安排为从现在起继续持有整四年，随后全部赎回；期间不追加、不提前或分批取款、不再替换，也不转换为定期年金给付。
- '**本次决策后账户起始价值：** 100,000美元。'
- '**年度身故保障附加费率：** 0.10%。'
- '**底层基金年度费用率：** 0.51%。'
- '**年度定额账户管理费：** 标准30美元，本次持有期间减免。'
- 公司已确认本次替换可以办理。新旧合同均采用同一底层基金、相同配置及投资管理安排，底层投资风险相同；服务与交易办理条件相同。资金直接转移，本次模拟不设转移空档或额外交易费，税务条件不设为选项差异。
options:
- id: A
  label: 保留原合同
- id: B
  label: 替换为新合同
comparison:
- id: attribute-01
  attribute: 合同识别代码
  values:
    A: AN01
    B: AN02
- id: attribute-02
  attribute: 保险合同年度基础费率
  values:
    A: 1.15%
    B: 1.30%
- id: attribute-03
  attribute: 上述年度比例费用合计
  values:
    A: 1.76%
    B: 1.91%
- id: attribute-04
  attribute: 已记录的最高合同周年价值
  values:
    A: 140,000美元，继续沿用
    B: 从新合同起始价值100,000美元重新记录
- id: attribute-05
  attribute: 退保收费期
  values:
    A: 已经过完
    B: 自新合同成立重新起算七年
- id: attribute-06
  attribute: 外部合格转入奖励规则
  values:
    A: 本次不发生新转入
    B: 合格外部转入金额可获3%奖励；具体资格见下方
additional_information:
- id: information-01
  kind: terms
  title: 新合同期末赎回时点
  text: 若选择B，期末赎回日在新合同第四个周年日，即进入第五个合同年度。
- id: information-02
  kind: terms
  title: 适用及办理条款
  text: |-
    **身故保障。** 两份合同均按“身故时账户价值、累计投入金额、已记录的最高合同周年价值”三者中最高的一项向受益人给付。本次持有期间，最高周年价值在每个合同周年日核对并只向上更新。本次原合同累计投入为100,000美元；替换后，新合同累计投入和最高周年记录均从100,000美元起算。原合同的140,000美元记录随原合同终止，不转入新合同。期末正常赎回按账户价值结算。

    **转入奖励资格。** 新合同的3%奖励适用于并非由公司M或其关联机构销售的投资工具所转入的合格资金。本次资金来自公司M销售的原年金合同，不属于这项奖励的合格来源。

    **新合同退保费用。** 第1至第7个合同年度费率依次为9%、8%、7%、6%、5%、4%、2%；第8年起为0%。第一年后，每个合同年度可取账户价值的10%而不收退保费，额度不跨年累计。期末全部赎回时，当年10%额度适用，其余90%按所在合同年度费率收费。本次没有已使用的当年额度，也不适用内部转入退保费豁免或其他特殊豁免；身故给付不扣退保费。

    **费用与合同范围。** 上述比例费用按账户价值计提，在本次四年持有期间保持不变。两份合同均未选择额外的保证收入或终身提款附加保障。

    合同资格核验：原合同不属于本次内部替换计划指定的合资格合同，公司未批准另项内部转入退保费豁免。按本次替换确认的L类收费表办理。
references:
- document_id: 02-01
  title: 递延可变年金招募说明书（02-01）
  file: 02-01_递延可变年金招募说明书.pdf
task: 你需要选择：A，继续持有原合同；或B，终止原合同，把100,000美元账户价值全部直接转入新合同。
knowledge:
- id: term-01
  title: 可变年金与账户价值
  text: 可变年金是保险合同，账户价值随所选底层投资的表现和费用变化。合同替换是终止原合同、将可转移资金投入另一份合同，并按新合同管理。
- id: term-02
  title: 身故保障与周年记录
  text: 身故保障用于在合同约定的身故事件发生时向受益人给付。最高合同周年价值是合同周年日记录的历史账户价值，不等于当前可提取的现金。
- id: term-03
  title: 费用术语
  text: 退保费是在适用收费期取款时收取的合同费用。免费取款额度仅表示相应金额不收退保费。比例费用按资产计提，定额费用按金额收取；转入奖励则按符合资格的资金计算。

schema_version: '2.0'
case_id: '01'
scenario_id: S-JPM-01
locale: en
title: 'Choosing fund shares: an eight-year investment'
template: table
background: You are reviewing Fund M on an investment platform and plan to invest $40,000 in it.
common_facts:
- If you proceed, you must choose either share class A or share class B and invest the full amount in that class. You cannot split the investment between them.
- You will hold this investment for exactly eight years and redeem it in full at the end of that period. For this task, there will be no additional investments, early or partial redemptions, or conversions between share classes.
- You also hold other investments in the same fund family, currently worth $20,000. You will not sell these holdings. The platform has verified that they qualify to be combined with this purchase when determining the sales-charge discount tier for class A. The relevant account information has already been submitted.
- The platform has completed account and identity verification. Both share classes have the same account services, transaction processing, settlement, and tax treatment through this channel. The platform charges no additional fees specific to either class. This purchase does not use a letter of intent for future purchases, and neither a full waiver of the purchase sales charge nor a special waiver of the deferred sales charge applies. The existing holdings qualify for the cumulative discount as confirmed above.
- The platform has confirmed that this account is eligible to buy both A and B. No other share classes are available for this purchase.

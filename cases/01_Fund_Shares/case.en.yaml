task: Assume that you have already decided to buy Fund M. Choose a share class by comparing the net economic value of this new investment at the end of eight years.
knowledge:
- id: term-01
  title: Funds and share classes
  text: Fund shares represent an investor’s interest in a fund. Different share classes of the same fund may invest in the same portfolio while having different fee arrangements.
- id: term-02
  title: Fee terminology
  text: A purchase sales charge is collected when shares are bought; a deferred sales charge is collected when shares are redeemed under the conditions specified in the contract. Annual operating expenses are assessed against the value of the fund’s assets. Distribution fees cover the sale and distribution of fund shares, while shareholder service fees relate to support for shareholder accounts. Fee waivers and reimbursements are reductions in, or compensation for, certain expenses by service providers.
- id: term-03
  title: Combining holdings for a discount
  text: Eligible existing holdings can be combined with a new purchase to determine the applicable sales-charge tier. This does not require selling the existing holdings.

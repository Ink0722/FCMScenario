schema_version: '2.0'
case_id: '01'
scenario_id: S-JPM-01
locale: zh-CN
title: 基金份额选择：八年持有
template: table
background: 你正在投资平台上了解基金M，计划用40,000美元购买该基金。
common_facts:
- 如果进行这笔投资，你需要在份额A和份额B中选择一种，将这笔金额全部用于所选份额，不能分拆投入。
- 这笔资金持有整八年，并在八年期末全部赎回。按本次任务安排，期间不追加投资、不提前或分批赎回，也不转换份额。
- 你的账户中另有同一基金系列的持仓，当前市值为20,000美元，本次不出售。平台已核验这些持仓可与本次购买合并，用于确定A的购买费折扣档位，相关账户资料已经提交。
- 平台已完成账户及身份核验。两种份额在本渠道采用相同账户服务、交易办理、到账及税务条件，平台不另收份额专属费用。本次不使用未来购买意向书，不适用购买销售费全额豁免或特殊递延销售费豁免；已有持仓的累计折扣资格按上文确认。
- 平台已确认本次账户可以购买A、B，其他份额不在本次可购买范围内。
options:
- id: A
  label: 份额A
- id: B
  label: 份额B
comparison:
- id: attribute-01
  attribute: 平台识别代码
  values:
    A: MX01
    B: MX02
additional_information: []
references:
- document_id: 01-01
  title: 基金M招募说明书（01-01）
  file: 01-01_基金M招募说明书.pdf
task: 本次任务是在已决定购买基金M的条件下选择份额，以本次新投资八年期末的净经济价值为比较目标。
knowledge:
- id: term-01
  title: 基金与份额
  text: 基金份额代表投资者在基金中的权益。同一基金的不同份额可以投资同一组合，同时采用不同收费安排。
- id: term-02
  title: 收费术语
  text: 购买时销售费在购买时收取；递延销售费在符合合同条件的赎回发生时收取。年度运营费用按基金资产价值计提。分销费用于基金份额的销售与分销，股东服务费与持有人账户支持有关。费用减免与补偿是服务机构对部分费用的减收或补偿。
- id: term-03
  title: 持仓合并与折扣
  text: 持仓合并是把符合条件的已有持仓与新购买金额合并，用于确定购买费档位，不要求卖出已有持仓。

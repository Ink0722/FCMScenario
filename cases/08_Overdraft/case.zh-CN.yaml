schema_version: '2.0'
case_id: 08
scenario_id: S-TD-OD-01
locale: zh-CN
title: 日常账户透支设置：账单与临时支付
template: cards
background: 你正在确认一个美国日常付款账户的透支设置。账户已包含标准透支服务，目前没有开通一次性刷卡及ATM交易的可选透支功能。银行允许你保持现有设置，也可以另行开通这项功能。
common_facts:
- 当前账户可用余额为80美元，没有其他待处理交易。下周安排如下；这些日期均为营业日，银行已经确认表内入账资金周五才可用。
- |-
  | 事项 | 时间 | 金额 | 办理方式 |
  |---|---|---:|---|
  | 房租 | 周一 | 400美元 | 房东按已授权的账户号码发起ACH自动扣款 |
  | 通信账单 | 周二 | 60美元 | 服务商按已有授权进行每月重复的借记卡扣款 |
  | 日用品采购 | 周三 | 约100美元 | 到商店时进行一次性借记卡付款 |
  | 已确认的入账资金 | 周五 | 1,200美元 | 入账后可用于账户付款及归还透支 |
- 本次账户没有关联储蓄账户或已批准的透支额度。
- '**标准透支服务：** 保留。'
- '**储蓄账户自动补款：** 本次未设置。'
- '**ACH自动扣款、支票、重复借记卡扣款：** 由标准服务按规则处理。'
- '**已支付透支的费用规则：** 超过规定阈值时每笔35美元，每日最多3笔；符合补款规则可退还。'
- '**账户查看与通知：** 网上查余额、设置余额及透支通知。'
options:
- id: A
  label: 开通一次性刷卡及ATM交易的可选透支功能
- id: B
  label: 保持现有设置，不开通该功能
comparison:
- id: attribute-01
  attribute: 余额不足的一次性借记卡付款
  values:
    A: 银行可以决定批准并支付
    B: 通常在授权时拒绝；未批准的交易不产生该笔透支费
- id: attribute-02
  attribute: 余额不足的ATM取款
  values:
    A: 银行可以决定批准并支付
    B: 通常在授权时拒绝；未批准的交易不产生该笔透支费
- id: attribute-03
  attribute: 对付款的承诺
  values:
    A: 每种交易是否支付由银行决定
    B: 标准服务内的交易是否支付同样由银行决定
- id: attribute-04
  attribute: 服务资金来源
  values:
    A: 银行支付获准的透支，形成账户负余额
    B: 标准服务获准的透支也形成账户负余额
- id: attribute-05
  attribute: 后续修改
  values:
    A: 可以申请取消可选功能
    B: 可以申请开通可选功能
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **收费与补款。** 获准支付的交易使可用余额透支超过50美元时，适用每笔35美元透支费；每个账户每日最多收取3笔。透支50美元及以下不收该透支费。若在该笔透支入账后的下一营业日美国东部时间晚上11点前补足资金，使可用余额达到0美元或以上，银行按规则退还该笔已收透支费。补款时也计入新增或待处理的扣款。

    **资金使用。** 透支需及时归还。开通功能不会提高ATM日取款限额，也不设关联账户自动转入资金。银行不会因为开通就承诺支付每笔交易。

    **授权与入账。** 可用余额包含已经影响余额的待处理交易。本次可选功能如开通，会在上述交易之前生效。已经获准的一次性刷卡交易，其后入账时也可能改变余额；未开通并不阻止所有情况下出现负余额。

    **其他账户条件。** 两种设置不改变账户的月费、原有标准服务及通知功能。当前账户没有另外的年度透支费自动返还权益。本次选择仅涉及可选功能，不切换到“拒绝全部透支”设置。

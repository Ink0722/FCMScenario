task: 你需要选择账户设置，并考虑它对日常账单、临时购买及余额不足时办理结果的影响。采购是否调整时间，由你结合自己的需要考虑。
knowledge:
- id: term-01
  title: 借记卡与可用余额
  text: 借记卡使用银行账户资金。可用余额是当前可用于支付的金额，可能与仅列出已经入账项目的账面余额不同。
- id: term-02
  title: 付款类型
  text: ACH是使用账户信息办理的电子转账或扣款。重复借记卡扣款依据已有的持续授权办理；一次性刷卡是在本次购买时发起的单次付款。两者都可能使用同一张卡。
- id: term-03
  title: 透支与关联补款
  text: 透支是银行在资金不足时支付交易，使账户形成负余额。关联储蓄账户补款是把另一账户已有资金转入付款账户，是另一种安排。

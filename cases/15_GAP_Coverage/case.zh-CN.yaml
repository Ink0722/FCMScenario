schema_version: '2.0'
case_id: '15'
scenario_id: S-TOY-GAP-01
locale: zh-CN
title: 汽车贷款：是否加入余额差额保障
template: cards
background: 你正在为一辆自用汽车办理贷款，贷款机构另外提供余额差额保障（GAP）项目。
common_facts:
- 你正在为一辆自用汽车办理贷款。车辆的参考零售价值为25,000美元，本次贷款本金为28,000美元，期限60个月。贷款中没有旧车欠款、延长保修或其他附加产品。车辆的日常用途是通勤和私人出行，不用于营运、网约车或送货。
- 你已购买车辆碰撞及综合损失保险，免赔额为1,000美元。该保险发生全损或盗窃未追回时，按照事故发生时的车辆实际现金价值核定赔款，再扣除适用免赔额。普通车险不按照尚欠贷款的金额直接赔偿。
- 两种选择都可以完成同一笔贷款，贷款利率、还款日期和车辆保险保持相同；购买保障不影响贷款批准。
- 两个方案中，你都按时偿还贷款并持续维持现有车险。贷款机构已核验车辆年龄、贷款期限及贷款与车辆价值比例，确认可以加入GAP。你有足够现金支付499美元，也有另外保留的备用资金；是否购买不影响本期必要生活支出。
options:
- id: A
  label: 不加入余额差额保障
- id: B
  label: 加入余额差额保障
comparison:
- id: attribute-01
  attribute: 本次项目费用
  values:
    A: 0美元
    B: 一次性499美元，从现有现金支付，不加入贷款本金
- id: attribute-02
  attribute: 车辆全损或盗窃未追回
  values:
    A: 普通车险按自身合同处理赔款；贷款余额扣除赔款后的剩余部分由你偿还
    B: 普通车险先处理赔款；符合GAP合同的剩余贷款部分由贷款机构取消
- id: attribute-03
  attribute: GAP取消债务金额上限
  values:
    A: 不适用
    B: 合计最高50,000美元，其中车险免赔额部分最高覆盖1,000美元
- id: attribute-04
  attribute: 日常维修、部分损坏
  values:
    A: 按普通车险及车辆维修安排处理
    B: GAP不承担这些项目，普通车险及维修安排相同
- id: attribute-05
  attribute: 索赔流程
  values:
    A: 办理普通车险理赔
    B: 还需向贷款机构提交保险结算、贷款和事件证明；保险最终结算后一年内提出申请
- id: attribute-06
  attribute: 索赔处理期间
  values:
    A: 按原贷款合同继续付款
    B: 同样继续付款；获准取消的债务按损失发生日记入贷款，符合条件的处理中付款再结算
- id: attribute-07
  attribute: 退出项目
  values:
    A: 无项目可退出
    B: 加入后60天内可申请退还费用；若此前已发生保障事件，费用不退。超过60天费用不退，保障继续按合同执行
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    GAP只处理加入后发生的合格全损或盗窃未追回事件。它不取消事故发生后的利息或费用、已经到期的应付款、合同排除的附加产品金额，也不承担故意造成或欺诈导致的损失。可从其他保险、残值处置或可退附加产品取得的款项，先按合同冲减差额。

    保障随本笔贷款持续；若提前结清、出售车辆并结束贷款或再融资关闭原贷款，保障随之终止。未来车辆价值、剩余贷款余额和是否发生合格事件，取决于之后的实际情况。本次选择同时涉及现在的项目支出与未来可能出现的债务差额，没有预定的事故结果。

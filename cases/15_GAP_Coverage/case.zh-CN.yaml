  file: 15-02_加州汽车保险指南.pdf
task: 你需要决定本次贷款是否加入该项目。
knowledge:
- id: term-01
  title: 实际现金价值
  text: 保险机构对损失发生时车辆价值的认定，不等同于最初购车价格或剩余贷款。
- id: term-02
  title: 免赔额
  text: 在符合普通车险合同的损失中，由车主自行承担的金额。
- id: term-03
  title: GAP
  text: 这里是贷款机构有条件取消债务的合同安排，不是替代车险的新车赔偿，也不是返还购车款。

task: 现在需要决定：在冻结之外，是否额外订阅一项付费信用与身份监测服务，还是自行检查免费报告并处理异常。请结合提醒、管理方式、后续办理及费用，选择自己的安排。
knowledge:
- id: term-01
  title: 信用报告与评分
  text: 信用报告记录账户、借贷及还款等资料。信用评分是基于有关资料计算的指标；不同机构和用途可以使用不同评分模型。
- id: term-02
  title: 冻结、监测与保险
  text: 冻结管理信用资料的访问；监测检查纳入范围的变化并提供提醒；保险依据承保事件及合同处理赔付。三者属于不同办理机制，可以同时使用。
- id: term-03
  title: 完整报告与变化提醒
  text: 完整报告呈现一次取得时的资料；变化提醒是在监测发现符合条件的变化后发出的通知。完整报告更新频率与提醒频率可以不同。

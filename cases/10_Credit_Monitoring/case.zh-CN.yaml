schema_version: '2.0'
case_id: '10'
scenario_id: S-CO-CM-01
locale: zh-CN
title: 信用资料保护：是否增加付费监测
template: cards
background: 你在一周前收到原服务机构的个人资料泄露通知，涉及姓名、出生日期及美国社会保障号码。
common_facts:
- 通知列出涉及的资料类型、事件调查及联系渠道，未报告本次已经确认的冒名开户或资金损失。
- 收到通知后的次日，你取得三家主要征信机构的信用报告并检查现有银行和信用卡账单。截至本次决策日，已取得的报告中没有发现不认识的账户或申请记录，已检查的账单中也没有发现未授权交易。你已经保存通知、报告和检查日期。
- 你准备在三家征信机构分别办理免费信用冻结，现有银行卡继续使用。你预计三个月后可能申请一张新信用卡，届时需要安排临时解除相关冻结。
- '**冻结及临时解除费用：** 免费。'
- '**三家信用冻结：** 分别向三家征信机构办理。'
- '**新信用申请前的冻结处理：** 仍需向相关征信机构临时解除冻结。'
options:
- id: A
  label: 办理冻结，并订阅付费监测服务
- id: B
  label: 办理冻结，暂不订阅，自己查看免费报告
comparison:
- id: attribute-01
  attribute: 额外订阅费用
  values:
    A: 每月29.95美元，按月自动续费
    B: 无该订阅费
- id: attribute-02
  attribute: 三家完整报告查看
  values:
    A: 在服务平台集中查看，完整报告及相应评分每季度更新
    B: 通过官方免费渠道分别取得三家报告，每家可每周免费获取一次
- id: attribute-03
  attribute: 信用报告变动
  values:
    A: 服务持续监测纳入范围的数据，发现符合触发条件的变化后发送邮件或应用提醒
    B: 自己取得报告并检查变化，不由本安排提供自动变化提醒
- id: attribute-04
  attribute: 身份资料监测
  values:
    A: 对服务纳入范围的身份资料及相关网络信息进行监测
    B: 本安排不包含同类商业监测
- id: attribute-05
  attribute: 信用评分资料
  values:
    A: 提供多个用途的FICO评分版本及评分模拟工具
    B: 免费报告渠道主要提供报告；本安排不包含相同评分套装
- id: attribute-06
  attribute: 身份盗用后的办理
  values:
    A: 包含美国境内身份恢复协助服务
    B: 可使用官方免费恢复计划，并自行联系有关机构
- id: attribute-07
  attribute: 随服务附带的身份盗用保险
  values:
    A: 最高100万美元，按承保范围及理赔规则审核有关费用和损失
    B: 本安排不附带同类商业保险
- id: attribute-08
  attribute: 后续修改
  values:
    A: 可以取消订阅，信用冻结继续保留
    B: 可以以后另行订阅监测服务
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **信用冻结。** 冻结限制征信机构向一般新信贷申请方提供信用资料，已有账户机构等依法例外的访问不按一般新申请处理。冻结不降低信用评分，不关闭现有银行卡；之后申请新信用时可临时解除，再恢复冻结。

    **监测与报告更新。** A的完整三家报告按季度更新，与持续监测及变化提醒是不同功能。提醒的触发项目、频率和时间因征信机构而异；本次不设定每笔账户交易都产生即时提醒。两边均继续查看原银行及信用卡账单。

    **保险与恢复协助。** A按本次已核验的个人会员资格提供服务及附带保险。相关恢复费用、法律费用等按承保范围审核；需提交实际损失及办理资料，赔付受保险总限额、除外责任和其他赔付来源等条款约束。已经在生效前发现的身份盗用不属于该保险承保事件。

    **订阅办理。** A按每月29.95美元自动续费，可随时取消，但已开始月份不按剩余天数部分退款。本次不适用免费试用或首月折扣。取消商业服务不会代你撤销已经办理的信用冻结。

    **免费办理渠道。** B通过官方指定渠道获取报告；如发现身份盗用，可在官方身份盗用处理网站取得个人恢复计划。两边办理冻结均需要身份核验，恢复或订阅监测均需按有关流程完成。

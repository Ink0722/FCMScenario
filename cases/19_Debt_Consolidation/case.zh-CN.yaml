schema_version: '2.0'
case_id: '19'
scenario_id: S-LCL-DC-01
locale: zh-CN
title: 信用卡欠款：合并贷款还是保留分卡还款
template: table
background: 你准备清偿两笔现有信用卡欠款，正在选择个人贷款合并或保留分卡还款。
common_facts:
- 你有两笔正常还款中的信用卡购买余额，每笔7,173美元，合计14,346美元。第一笔当前年利率为18.74%，第二笔为24.74%；两笔都是随美国优惠利率变化的浮动利率，优惠利率变化时，相应账户利率一起调整，合同最高年利率29.99%。两笔余额均已过免息促销期。
- 你准备停止增加这两张卡的欠款，开始清偿现有债务。你收到一项已经确认可办理的36个月个人贷款，可以将贷款到手款用于结清这两笔卡债。贷款不以房屋或汽车作抵押。
- 你已经安排每月最高600美元用于这些债务，因此可以承担新贷款月供，也可以继续按原卡规则付款。在这个额度内，你可以自主决定是否增加还款；以后的额外现金流依实际情况使用。
- 你没有逾期、超额度或本任务中的年费、加急服务费；按时付款，不办理余额转移或取现。两项均可办理自动付款，资金安排相同。选择A后，原信用卡仍可保留，但按本次计划不再增加消费余额。
options:
- id: A
  label: 采用36个月个人贷款结清两笔卡债
- id: B
  label: 保留两笔卡债并按原合同偿还
comparison:
- id: attribute-01
  attribute: 开始时的债务处理
  values:
    A: 到手贷款款项结清两笔现有购买余额
    B: 保留原有两笔余额及账户合同
- id: attribute-02
  attribute: 新贷款合同本金
  values:
    A: 15,262美元
    B: 无新贷款，本次余额合计14,346美元
- id: attribute-03
  attribute: 放款手续费
  values:
    A: 贷款本金的6%，本报价列示约916美元，放款时扣除
    B: 无本次新贷款放款手续费
- id: attribute-04
  attribute: 到手金额
  values:
    A: 报价列示约14,346美元，本次用于结清原债务
    B: 不发生新放款
- id: attribute-05
  attribute: 利率
  values:
    A: 固定名义年利率13.99%；包含手续费的披露APR为18.40%
    B: 当前两笔18.74%／24.74%，随优惠利率变化
- id: attribute-06
  attribute: 合同付款安排
  values:
    A: 36个月，每月约522美元；末期按实际余额结算
    B: 各自每月按账单最低付款规则支付，可自行加付
- id: attribute-07
  attribute: 提前清偿
  values:
    A: 可以提前或额外还款，无提前清偿罚金；放款手续费已在开始时扣除
    B: 可以随时全部或部分还款，无本次贷款放款费
- id: attribute-08
  attribute: 账户管理
  values:
    A: 清偿后按一笔新贷款账单付款，原卡停止新增购买
    B: 继续处理两张卡各自的账单和到期日，停止新增购买
additional_information:
- id: information-01
  kind: terms
  title: 方案B最低付款规则
  text: B的每张卡最低付款按以下规则计算：账单新余额的1%，加该期利息及适用费用，金额向上取整到整数美元；与25美元比较，取较高者。若余额不足25美元，支付全部余额。两张卡分别计算，不是合计只付25美元。
- id: information-02
  kind: terms
  title: 适用及办理条款
  text: |-
    A的手续费在放款时发生，到手款少于新贷款合同本金。每月正常还款会同时偿还本金和利息。额外付款减少之后的未偿本金和利息，新贷款原先扣除的手续费不因此变成未发生费用。

    B只要满足每张卡的账单最低付款，可以自主提高还款金额；利息按合同的每日余额方法计入账单。最低付款金额随账单变化，原卡合同没有给现有余额设定固定36个月清偿日期。

    本次选择的是债务合同及付款安排，不是再申请其他优惠卡。现有余额之外没有需要加入本任务的其他债务；两项都以偿还现有欠款为目标。
references:
- document_id: 19-01
  title: 个人贷款办理及费用资料（19-01）
  file: 19-01_个人贷款办理及费用资料.pdf
- document_id: 19-02
  title: 现有信用卡账户协议（19-02）
  file: 19-02_现有信用卡账户协议.pdf
task: 请选择从现在开始采用哪种债务安排。
knowledge:
- id: term-01
  title: 放款手续费
  text: 贷款开始时扣除的费用，借款合同本金与实际到手款因此不同。
- id: term-02
  title: 名义利率与APR
  text: 名义利率用于计算贷款利息；APR按规定纳入相应贷款费用，不能把两者相加作为新的利率。
- id: term-03
  title: 最低付款
  text: 按账户合同计算的当期最低应付金额，并不等于本期全部欠款或固定期限的清偿付款。

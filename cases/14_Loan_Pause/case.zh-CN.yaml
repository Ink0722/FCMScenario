schema_version: '2.0'
case_id: '14'
scenario_id: S-NAV-SP-01
locale: zh-CN
title: 教育贷款暂停还款：资格与利息安排
template: cards
background: 你目前失业，准备为两笔美国联邦本科教育贷款申请同一个90天期间的暂停还款安排。
common_facts:
- 你有两笔美国联邦本科教育贷款，由同一个服务机构管理，目前账户没有逾期或未付利息。两笔贷款首次发放均在2019年7月1日至2020年6月30日之间，合同固定年利率均为4.53%。一笔为联邦直接补贴贷款，当前本金4,500美元；另一笔为联邦直接非补贴贷款，当前本金5,500美元。
- 你目前失业，已经取得失业补助的正式证明，覆盖接下来90天。你有之后开始工作的录用安排，准备在这90天内暂停正常月供，结束后恢复付款。贷款机构已经核对本次暂停期限与剩余可用期限，并确认两种下列申请安排均可办理，能够覆盖同一个90天期间。
- 暂停结束后，你会用另行准备的资金支付本次新增利息，之后按原贷款安排恢复还款。
- '**本次暂停覆盖：** 两笔贷款，同一个90天期间。'
- '**期间正常月供：** 暂停要求支付。'
- '**补贴贷款本金：** 4,500美元。'
- '**非补贴贷款本金：** 5,500美元。'
- '**原贷款合同利率：** 保持不变。'
- '**提交及批准费用：** 无本次服务费。'
- '**结束处理：** 恢复付款；本次安排支付期间新增利息。'
- '**本次资料准备状态：** 两种申请均可完整提交；失业补助正式证明已取得。'
options:
- id: A
  label: 申请一般暂缓还款
- id: B
  label: 提交失业补助证明，申请失业延期还款
comparison:
- id: attribute-01
  attribute: 所用机制
  values:
    A: General Forbearance
    B: Unemployment Deferment
- id: attribute-02
  attribute: 申请依据
  values:
    A: 当前暂时性经济困难，服务机构审核批准
    B: 当前失业及相应补助证明，核对延期资格
- id: attribute-03
  attribute: 补贴贷款期间利息
  values:
    A: 按4.53%计入借款人应付利息
    B: 该延期期间不向借款人收取利息
- id: attribute-04
  attribute: 非补贴贷款期间利息
  values:
    A: 按4.53%计入借款人应付利息
    B: 同样按4.53%计入借款人应付利息
- id: attribute-05
  attribute: 申请资料
  values:
    A: 暂缓申请表，说明暂时性经济困难及所需期间
    B: 延期申请表，并附失业补助证明
additional_information:
- id: information-01
  kind: terms
  title: 适用及办理条款
  text: |-
    **资格与期限。** B使用已取得的失业补助证明申请，不需要在本次任务中另找资格证据。两种机制均有可用期限，且服务机构已确认90天能够覆盖；不会因一边申请不获批或批准较晚而缩短暂停期。

    **利息计算对象。** 两笔贷款保持各自的本金和贷款类型，未合并或转为私人贷款。期间没有本金还款或新的借款，利息按照各笔合同的日计息方式累计；上述利率为合同年利率，不是90天费率。

    **应付利息与本金。** 计入应付利息不等于当日把利息加入贷款本金。对本次直接贷款，一般暂缓期间未付利息不因该暂缓结束自动资本化；非补贴贷款延期结束时，尚未支付的应计利息适用计入本金的处理。本次会按服务机构结算安排支付全部新增利息，不留作后续未付余额。

    **办理阶段。** 两边都在正常月供到期之前提交，批准期间一致。一般暂缓申请仍由服务机构审核；本次已确认批准条件，不把它视为无条件自动生效。

    **比较范围。** 本次选择上述两种短期暂停机制，评价的是90天期间新增的借款人应付利息。原还款计划、两笔贷款的其他权利及恢复付款安排保持不变，本次不办理收入驱动还款计划、减免或再融资。

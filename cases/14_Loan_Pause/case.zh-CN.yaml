  file: 14-02_失业延期还款申请.pdf
task: 你正在选择一般暂缓还款申请，或按失业资格申请延期还款。两边都能完成当前的暂停目标；你的任务是选择使这90天新增应付利息较少的安排。
knowledge:
- id: term-01
  title: 贷款服务机构
  text: 服务机构负责账单、付款记录及相关申请处理。它负责管理贷款，不等于另向你发放一笔新贷款。
- id: term-02
  title: 补贴与非补贴贷款
  text: 这是两种不同的联邦贷款类型，部分期间的利息承担规则不同。贷款类型由原合同确定，不因选择申请表而转换。
- id: term-03
  title: 暂停还款与资本化
  text: 暂停还款是在获准期间暂不要求正常付款，本金债务仍保留。资本化是把尚未支付的利息加入本金，之后以新的本金余额计息。
